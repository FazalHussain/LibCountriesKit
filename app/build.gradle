plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'co.gistech.libs.countrieskit'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to extract JAR from AAR for JitPack compatibility
task createJar(type: Copy) {
    dependsOn 'assembleRelease'
    
    def aarFile = file("$buildDir/outputs/aar/${project.getName()}-release.aar")
    def outputDir = file("$buildDir/libs")
    
    from(zipTree(aarFile)) {
        include "classes.jar"
    }
    into(outputDir)
    
    // Rename with version at execution time
    rename { filename ->
        def version = android.defaultConfig.versionName
        return "LibCountriesKit-${version}.jar"
    }
    
    doLast {
        def version = android.defaultConfig.versionName
        def jarFileName = "LibCountriesKit-${version}.jar"
        def jarFile = file("$buildDir/libs/${jarFileName}")
        if (jarFile.exists()) {
            println "✓ JAR created: ${jarFile.absolutePath}"
        }
    }
}

afterEvaluate {
    def version = android.defaultConfig.versionName
    def jarFileName = "LibCountriesKit-${version}.jar"
    def jarFile = file("$buildDir/libs/${jarFileName}")
    
    // Ensure JAR is created before publishing
    tasks.named('publishToMavenLocal').configure {
        dependsOn 'createJar'
    }
    
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = 'com.github.FazalHussain'
                artifactId = 'LibCountriesKit'
                version = version
                
                // Add JAR artifact to publication
                artifact(jarFile) {
                    classifier = null
                    extension = 'jar'
                    builtBy createJar
                }
            }
        }
    }
}
