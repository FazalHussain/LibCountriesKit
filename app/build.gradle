plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'co.gistech.libs.countrieskit'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to extract JAR from AAR for JitPack compatibility
task createJar {
    dependsOn 'assembleRelease'
    
    // Capture values at configuration time to avoid configuration cache issues
    def buildDirectory = layout.buildDirectory
    def projectName = project.name
    def versionName = android.defaultConfig.versionName
    
    doLast {
        def buildDir = buildDirectory.get().asFile
        def outputDir = new File(buildDir, "libs")
        outputDir.mkdirs()
        
        // Try different possible AAR file paths
        def aarDir = new File(buildDir, "outputs/aar")
        def possiblePaths = [
            new File(aarDir, "${projectName}-release.aar"),
            new File(aarDir, "app-release.aar")
        ]
        
        // If none of the expected paths exist, search for any .aar file
        def aarFile = possiblePaths.find { it.exists() }
        if (aarFile == null && aarDir.exists()) {
            def aarFiles = aarDir.listFiles(new FilenameFilter() {
                boolean accept(File dir, String name) {
                    return name.endsWith(".aar") && name.contains("release")
                }
            })
            if (aarFiles != null && aarFiles.length > 0) {
                aarFile = aarFiles[0]
            }
        }
        
        if (aarFile == null || !aarFile.exists()) {
            throw new GradleException("AAR file not found. Tried: ${possiblePaths.collect { it.absolutePath }.join(', ')}. Searched in: ${aarDir.absolutePath}")
        }
        
        println "Using AAR file: ${aarFile.absolutePath}"
        
        def jarFileName = "LibCountriesKit-${versionName}.jar"
        def jarFile = new File(outputDir, jarFileName)
        
        // Extract classes.jar from AAR
        java.util.zip.ZipFile zipFile = new java.util.zip.ZipFile(aarFile)
        try {
            java.util.zip.ZipEntry classesJar = zipFile.getEntry("classes.jar")
            if (classesJar == null) {
                throw new GradleException("classes.jar not found in AAR: ${aarFile.absolutePath}")
            }
            
            // Copy classes.jar to output
            jarFile.withOutputStream { out ->
                zipFile.getInputStream(classesJar).withStream { input ->
                    out << input
                }
            }
            
            println "✓ JAR created: ${jarFile.absolutePath} (${jarFile.length()} bytes)"
        } finally {
            zipFile.close()
        }
    }
}

afterEvaluate {
    def version = android.defaultConfig.versionName
    def jarFileName = "LibCountriesKit-${version}.jar"
    def jarFile = file("$buildDir/libs/${jarFileName}")
    
    // Ensure JAR is created before publishing
    tasks.named('publishToMavenLocal').configure {
        dependsOn 'createJar'
    }
    
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = 'com.github.FazalHussain'
                artifactId = 'LibCountriesKit'
                version = version
                
                // Add JAR artifact to publication
                artifact(jarFile) {
                    classifier = null
                    extension = 'jar'
                    builtBy createJar
                }
            }
        }
    }
}
